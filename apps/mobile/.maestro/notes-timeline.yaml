appId: com.clubedojogo.mobile.dev
---
- extendedWaitUntil:
    visible: Jogo do Mês(, tab, 1 of 5)?
    timeout: 30000
- tapOn: Jogo do Mês(, tab, 1 of 5)?
- scrollUntilVisible:
    element:
      text: Timeline
    direction: DOWN
- tapOn: Timeline
- scrollUntilVisible:
    element:
      id: timeline-composer-input
    direction: DOWN
- tapOn:
    id: timeline-composer-input
- eraseText: 100
- inputText: ${COMMENT_BODY}
- scrollUntilVisible:
    element:
      text: Comentar
    direction: DOWN
- tapOn: Comentar
- scrollUntilVisible:
    element:
      id: comment-body-[0-9a-f]{8}-.*
      text: (?i)${COMMENT_BODY}
    direction: DOWN
- assertVisible:
    id: comment-body-[0-9a-f]{8}-.*
    text: (?i)${COMMENT_BODY}
- takeScreenshot: comentario-publicado
- scrollUntilVisible:
    element:
      text: Notas
    direction: UP
- tapOn: Notas
- scrollUntilVisible:
    element:
      id: private-notes-input
    direction: DOWN
    centerElement: true
- tapOn:
    id: private-notes-input
    point: "95%,90%"
- eraseText: 100
- inputText: ${NOTE_BODY}
- scrollUntilVisible:
    element:
      text: Salvar anotação
    direction: DOWN
    centerElement: true
- tapOn: Salvar anotação
- assertVisible:
    id: note-row-.*
    text: (?i).*${NOTE_BODY}.*
- takeScreenshot: anotacao-confirmada
