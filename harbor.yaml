schemaVersion: 1
id: clube-do-jogo-codex
name: Clube do Jogo — Travessia Espacial
description: Cosmic Campfire theme with a first-person deep-space background.

environments:
  local:
    label: Local development
    mode: development
    components:
      web:
        label: Next.js web app
        adapter: command
        command: [npm, run, dev, --, --webpack, --hostname, 127.0.0.1, --port, "43124"]
        cwd: .
        match:
          cwd: .
          commandIncludes: [next-server]
        ports:
          - host: 127.0.0.1
            port: 43124
        health:
          - type: http
            url: http://127.0.0.1:43124/
            timeoutMs: 5000
            bodyIncludes: Clube do Jogo
            followRedirects: true
        links:
          - label: Clube do Jogo — Travessia Espacial
            url: http://127.0.0.1:43124/
